<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#24160a}
*,*:before,*:after{box-sizing:inherit}
[hidden]{display:none!important}
body,body.t-wood{--bd:#3d2612;--pg:linear-gradient(rgba(18,9,2,.52),rgba(18,9,2,.52)),var(--wood) 0 0/1600px 1000px,linear-gradient(180deg,#33200f,#24160a);--fg:#f6e8cf;--mut:#cdb48c;--btn:#5b3a1e;--btn2:#74492a;--btnfg:#f8ecd6;--line:#2b170a;--acc:#e8c27c;--accfg:#2a1707;--go:#f2b843;--gofg:#2a1707;--cfg:#2a1707;--cmut:#5c3a18;--panel:rgba(30,17,7,.96);
--card:repeating-linear-gradient(180deg,rgba(70,36,8,.10) 0 1px,rgba(0,0,0,0) 1px 6px),linear-gradient(180deg,#d8ae74,#c39558);
--ovbg:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 100%),linear-gradient(rgba(18,9,2,.18),rgba(18,9,2,.18)),var(--wood) 0 0/1600px 1000px,linear-gradient(180deg,#83532a,#5f3a19)}
body.t-honey{--bd:#e6ae35;--pg:linear-gradient(180deg,#fbeec6,#f3dc98);--fg:#3a2405;--mut:#7d5a17;--btn:#fff8e0;--btn2:#ffeeb0;--btnfg:#3a2405;--line:#c99a3a;--acc:#e9a11a;--accfg:#2b1600;--go:#b8620a;--gofg:#fff8e6;--cfg:#3a2405;--cmut:#7d5a17;--panel:rgba(255,244,205,.97);
--card:linear-gradient(180deg,#fff9e2,#fff1c4);
--ovbg:var(--tileH) 0 0/51.96px 90px,linear-gradient(180deg,#f8d268,#eeb43c)}
body.t-space{--bd:#0a0520;--pg:var(--stars) 0 0/520px 520px,radial-gradient(ellipse at 50% 0%,#1d0d45 0%,#07031a 70%);--fg:#ece4ff;--mut:#a99bd6;--btn:#241a48;--btn2:#33256c;--btnfg:#efe8ff;--line:#5a3fa8;--acc:#8b5cf6;--accfg:#ffffff;--go:#b48bff;--gofg:#14062f;--cfg:#ece4ff;--cmut:#a99bd6;--panel:rgba(12,6,32,.96);
--card:linear-gradient(180deg,#1e1444,#150d34);
--ovbg:var(--stars) 0 0/520px 520px,radial-gradient(ellipse at 50% 30%,#2a1160 0%,#07031a 75%)}
body{margin:0;min-height:100vh;background:var(--pg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:940px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font:700 34px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.5px}
#score{display:flex;align-items:center;gap:8px;color:var(--mut)}
.chip{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--line)}
#status{margin:10px 0 8px;font-size:18px;min-height:27px}
.board{position:relative;background:var(--bd,#000);border-radius:14px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
svg{width:100%;height:auto;display:block;touch-action:manipulation}

#ov .card{background:var(--card);color:var(--cfg);border:2px solid var(--line);border-radius:14px;padding:18px 22px 20px;width:100%;max-width:430px;margin:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#ov h2{font:700 24px/1.2 Georgia,serif;margin:0 0 4px}

.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--btn);color:var(--btnfg);cursor:pointer}

button.on,button.on:hover{border-color:var(--acc);background:var(--acc);color:var(--accfg)}
button.go{border-color:var(--go);background:var(--go);color:var(--gofg);font-weight:600}
button.go:hover{background:var(--go);filter:brightness(1.07)}

@keyframes hintPulse{0%,100%{opacity:.35}50%{opacity:1}}
.hint-mk{animation:hintPulse 1s ease-in-out infinite}
.grp{color:var(--cmut);font-size:14px;margin-top:10px}
.dsc{color:var(--cmut);font-size:14px;margin:4px 0 6px}
.tabs{display:flex;gap:6px;margin:8px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;padding:8px 6px}
.foot{margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
.seg{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}

button.big{width:100%;padding:12px 16px;font-size:17px;margin-top:4px}
button.sec{width:100%;margin-top:10px}
.pv{margin:8px 0 2px;border-radius:10px;border:2px solid var(--line)}

.win-pc{animation:winPulse .9s ease-out 2;transform-origin:center;transform-box:fill-box}

:fullscreen{background:#000}
:-webkit-full-screen{background:#000}

.sp-menu .sp-themes button.th-space{background:radial-gradient(circle at 35% 30%,#8b57dc,#25104f)}

.wf-text{position:relative;display:inline-block;font:700 clamp(28px,7vw,64px)/1.15 Georgia,'Times New Roman',serif;letter-spacing:.04em;text-align:center;text-transform:uppercase;user-select:none}

.wf-text .wf-light{position:relative;color:transparent;-webkit-text-stroke:2.2px var(--wfl);text-stroke:2.2px var(--wfl)}
.bye-card{background:var(--card);color:var(--cfg);border:2px solid var(--line);border-radius:14px;padding:22px 28px;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.bye-card h2{font:700 24px/1.2 Georgia,serif;margin:0 0 6px}

#fsmenu{display:none}
body.fs{background:var(--bd,#000);min-height:100vh}
body.fs #fsmenu{display:block;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:16;opacity:.7;padding:6px 14px}
body.fs header,body.fs main>details{display:none}
body.fs main{max-width:none;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:6px 10px}
body.fs .board{padding:0;box-shadow:none}
body.fs svg{max-height:calc(100vh - 120px)}

.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;margin:8px 0;cursor:pointer;font-size:15px}

.seg.three button{padding:9px 4px;font-size:14px}
select{font:inherit;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--btn);color:var(--btnfg)}
.vol{display:flex;align-items:center;gap:10px;color:var(--cmut);font-size:14px;margin:6px 0 2px}
.vol input{flex:1;accent-color:var(--acc);height:26px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
.vol input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);border:2px solid var(--cfg);margin-top:-8px}
.vol input::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.vol input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid var(--cfg)}
#ov .card details{text-align:left;margin-top:12px}
#ov .card details ul{font-size:14px;margin:8px 0 2px;padding-left:18px}
#ov .card details li{margin:6px 0}
.rulesview{text-align:left;font-size:14px;margin:8px 0 2px;padding-left:18px}
.rulesview li{margin:7px 0}
details{background:var(--btn);color:var(--btnfg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 2px;padding-left:20px;max-width:70ch}
details li{margin:5px 0}
@media (max-width:600px){
  main{padding:8px}
  .board{padding:4px;border-radius:12px}
  h1{font-size:28px}
  #status{margin:6px 0;font-size:17px;min-height:24px}
  #score{font-size:13px}
  .ctl{gap:6px;margin:8px 0 10px}
  .ctl button{padding:8px 12px;font-size:15px}
  #b{max-height:calc(100vh - 250px);max-height:calc(100dvh - 250px)}
  body.fs #b{max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px)}
  #ov{padding:8px}
  #ov .card{padding:14px 14px 16px}
  #ov h2{font-size:22px}
  .grp{margin-top:8px;font-size:13px}
  .seg{margin:5px 0 8px;gap:6px}
  .seg button{padding:8px 6px;font-size:14px}
  .tabs button{padding:7px 4px}
  .dsc{font-size:13px;margin:2px 0 4px}
  .opt{font-size:14px;margin:6px 0}
  .foot{margin-top:10px;padding-top:10px}
  button.big{padding:10px 14px;font-size:16px}
  button.sec{margin-top:8px}
  #splash{padding:10px;gap:12px}
}
@media (max-height:700px) and (orientation:portrait){
  #splash{gap:8px}
  #splash svg{width:min(64vw,38vh,340px)}
  .sp-menu{gap:7px}
  .sp-menu button{padding:6px 20px}
}
@media (max-height:520px) and (orientation:landscape){
  main{display:grid;grid-template-columns:minmax(0,1fr) clamp(150px,26vw,210px);grid-template-areas:"b h" "b s" "b t" "b c" "b d";grid-template-rows:auto auto auto auto 1fr;column-gap:10px;padding:6px 8px;align-items:start;max-width:none}
  header{grid-area:h;display:block}
  h1{font-size:24px}
  #score{font-size:12px;display:block;margin-top:2px}
  #status{grid-area:s;font-size:15px;margin:4px 0;min-height:0}
  .board{grid-area:b;padding:4px}
  #toast{grid-area:t;margin:2px 0;min-height:0;font-size:13px}
  #ctl{grid-area:c;flex-direction:column;align-items:stretch;margin:6px 0;gap:5px}
  #ctl button{width:100%;padding:7px 10px;font-size:14px}
  main>details{grid-area:d}
  #b{max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}
  body.fs main{display:flex;flex-direction:column}
  body.fs #b{max-height:calc(100vh - 80px);max-height:calc(100dvh - 80px)}
  #ov .card{max-width:560px;padding:10px 14px 12px}
  #ov h2{font-size:20px;margin:0}
  .tabs{margin:6px 0 2px;padding-bottom:6px}
  .grp{margin-top:5px;font-size:12px}
  .seg{margin:3px 0 6px}
  .seg button,.tabs button{padding:5px 8px;font-size:13px}
  .dsc{font-size:12px;margin:2px 0}
  .opt{font-size:13px;margin:4px 0}
  .foot{margin-top:8px;padding-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .foot button,button.big,button.sec{width:auto;flex:1 1 150px;margin:0;padding:8px 10px;font-size:14px}
  #splash{flex-direction:row;gap:26px}
  #splash svg{width:auto;height:min(80vh,320px);max-width:46vw}
  .sp-menu{gap:5px}
  .sp-menu button{padding:5px 18px;font-size:14px;min-width:150px}
  .sp-menu .sp-themes button{width:26px;height:26px;min-width:0;padding:0}
}
#matchEnd,#tut{position:fixed;inset:0;z-index:44;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px;overflow:auto;animation:wfIn .3s ease}
#tut{z-index:46}
.me-card{background:var(--card);color:var(--cfg);border:2px solid var(--line);border-radius:14px;padding:18px 22px;max-width:420px;width:100%;margin:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.me-card h2{font:700 24px/1.2 Georgia,serif;margin:2px 0 6px}
.me-card p{margin:6px 0}
.me-card .mut,.mut{color:var(--cmut);font-size:14px}
.me-big{font-size:19px;font-weight:600}
.me-list{list-style:none;padding:0;margin:10px 0;text-align:left;font-size:15px}
.me-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.me-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.tut-pic{width:min(260px,72vw);height:auto;margin:6px auto 4px;border-radius:10px;border:2px solid var(--line);display:block}
.tut-txt{text-align:left;font-size:15px}
.tut-dots{display:flex;gap:6px;justify-content:center;margin:8px 0 0}
.tut-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);opacity:.35}
.tut-dots i.on{opacity:1;background:var(--go)}
#upd{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;width:max-content;max-width:calc(100% - 24px);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--cfg);box-shadow:0 8px 28px rgba(0,0,0,.45);font-size:15px;animation:wfIn .3s ease}
#upd[hidden]{display:none!important}
#upd button{padding:7px 14px}
table.stats{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}

table.stats th:first-child,table.stats td:first-child{text-align:left}
</style>

<body>
<button id="fsmenu" onclick="togglePanel()">Опции</button>
<div id="splash" role="dialog" aria-label="РОЙ" hidden></div>
<div id="bye" role="dialog" aria-label="Вы покинули рой" hidden></div>
<div id="winFlash" role="status" hidden></div>
<div id="matchEnd" role="dialog" aria-label="Итог матча" hidden></div>
<div id="tut" role="dialog" aria-label="Как играть" hidden></div>
<div id="upd" role="status" hidden></div>
<main>
<header><h1>РОЙ</h1><div id="score"></div></header>
<p id="status" aria-live="polite"></p>
<div class="board"><svg id="b" role="img" aria-label="Игровое поле из шестиугольников"></svg><div id="ov" hidden></div></div>
<p id="toast" aria-live="polite"></p>
<div class="ctl" id="ctl"></div>
<details>
<summary>Правила</summary>
<ul id="rules"></ul>
</details>
</main>
<script>
const S=30,W=Math.sqrt(3)*S;
const COL=['#b36ad4','#ffa50a'],N=['фиолетовые','оранжевые'];
const NAMES={space:['фиолетовые','оранжевые'],wood:['тёмные','светлые'],honey:['тёмные','светлые']};
const CHIP={space:['#b36ad4','#ffa50a'],wood:['#5a3820','#e6c98f'],honey:['#8a3a0c','#f6c445']};
function applyNames(){N[0]=NAMES[theme][0];N[1]=NAMES[theme][1]}
const T0=[[4,1],[6,1],[8,1],[5,2],[7,2],[6,3]];
const TY_T=['s','t','t','s','s','t'],TY_B=['t','t','s','s','t','s'];
const QT=[[5,1],[7,1],[4,2],[8,2],[5,3],[7,3],[6,2]],QTY_T=['s','t','t','s','s','t','q'];
const QB=[[10,4],[12,4],[9,5],[13,5],[10,6],[12,6],[11,5]],QTY_B=['t','s','s','t','t','s','q'];
const SWT=[[2,1],[4,1],[6,1],[8,1],[10,1],[12,1],[3,2],[5,2],[7,2],[9,2],[11,2],[13,2]],SWTY_T=['q','t','t','t','t','q','q','s','s','s','s','q'];
const SWB=[[15,6],[13,6],[11,6],[9,6],[7,6],[5,6],[14,5],[12,5],[10,5],[8,5],[6,5],[4,5]],SWTY_B=['q','t','t','t','t','q','q','s','s','s','s','q'];
const STAR=[[2,0],[-2,0],[1,1],[1,-1],[-1,1],[-1,-1]],UP=[[0,-2],[-3,1],[3,1]],DN=[[0,2],[-3,-1],[3,-1]];
const svg=document.getElementById('b'),ov=document.getElementById('ov'),tt=document.getElementById('toast');
const key=(x,r)=>x+','+r,px=x=>x*W/2,py=r=>r*1.5*S;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const VERSION='1.2.1',NP_LIMIT=40,SAVE_KEY='ulei-save';
let tutStep=-1,statArm=false;
let matchMode='classic',selMM='classic',splash=true,splashT=null,byeOn=false,lastPV=null,rzT=null;
function phoneView(){return typeof innerWidth!='undefined'&&innerWidth<600&&innerHeight>innerWidth*1.1}
let G,vsAI=true,aiTimer=null,menu=true,started=false,selOpp=true,figMode='queen',selFig='queen';
const pcPrev=new Map();
let RULES={free:true,rep:false,turn:true,freeze:false},selFree=true,selRep=false,selTurn=true,selFreeze=false;
let musicOn=true;
let theme='wood',menuTab='game';
try{const th=localStorage.getItem('ulei-theme');if(th==='wood'||th==='honey'||th==='space')theme=th;else if(th==='classic')theme='space'}catch(e){}
let sfxOn=true,sfxStyle='marimba';

const nm=p=>N[p]+(vsAI&&p==1?' (компьютер)':'');
function toast(s){tt.textContent=s}
function init(R,keep){
  const prev=G;
  clearTimeout(aiTimer);aiTimer=null;
  const Q=figMode!=='none',SW=figMode==='swarm';R=8;
  const f=(Q&&!SW)?1:0,cells=new Set();
  for(let r=0;r<R;r++)for(let c=0;c<9;c++)cells.add(key(2*c+((r+f)%2==0?1:0),r));
  let T,B,ty;
  if(SW){T=SWT.map(a=>a.slice());B=SWB.map(a=>a.slice());ty=[SWTY_T,SWTY_B]}
  else if(Q){T=QT.map(a=>a.slice());B=QB.map(a=>a.slice());ty=[QTY_T,QTY_B]}
  else{
    T=T0.map(a=>a.slice());
    B=T.map(([x,r])=>[17-x,R-1-r]);ty=[TY_T,TY_B];
  }
  const ctr=Q?{T:new Set(T.filter((_,i)=>ty[0][i]=='q').map(a=>key(...a))),B:new Set(B.filter((_,i)=>ty[1][i]=='q').map(a=>key(...a)))}:null;
  G={R,mm:matchMode,score:[0,0],matchOver:false,flip:vsAI,queen:Q,swarm:SW,ty,ctr,cells,T,B,hive:{T:new Set(T.map(a=>key(...a))),B:new Set(B.map(a=>key(...a)))},home:['T','B'],round:1,turn:0,phase:'setup',setupP:0,sel:null,last:[-1,-1],lastMove:null,winner:0,winFlash:false,winBy:null,hopelessOffer:null,queenMade:(keep&&prev&&prev.queenMade)||[false,false],pcs:[],rep:new Map(),hist:[],np:0,best:[0,0],ended:false,matchCard:false,undo:[],hint:null};
  if(keep&&prev){G.score=prev.score.slice();G.round=prev.round;G.hist=(prev.hist||[]).slice()}
  G.dist=buildDist(cells);
  T.forEach(([x,r],i)=>G.pcs.push({p:0,t:ty[0][i],d:'dn',x,r,frz:null,exp:false}));
  B.forEach(([x,r],i)=>G.pcs.push({p:1,t:ty[1][i],d:'up',x,r,frz:null,exp:false}));
  G.pcs.forEach((q,i)=>q.id=i);
  pcPrev.clear();
  toast('');render();
}
function stdP(p){
  const cells=p?G.B:G.T,types=G.ty[p];
  G.pcs.filter(q=>q.p==p).forEach((q,i)=>{q.x=cells[i][0];q.r=cells[i][1];q.t=types[i]});
  G.sel=null;render();
}
function feasible(p){
  const cap=[0,0,0],cnt=[0,0,0];
  for(const k of enemy(p))cap[+k.split(',')[0]%3]++;
  for(const q of G.pcs)if(q.p==p&&q.t=='t')cnt[q.x%3]++;
  return cnt.every((c,i)=>c<=cap[i]);
}
function ready(){
  if(!feasible(G.setupP)){
    toast('Так трутни не смогут дойти до улья соперника: каждый трутень ходит только по своим клеткам. Поменяйте трутней и звёзды местами.');
    return;
  }
  G.sel=null;
  if(G.setupP==0&&vsAI){
    const ps=G.pcs.filter(q=>q.p==1&&q.t!='q'),nt=ps.filter(q=>q.t=='t').length;
    for(let tries=0;tries<300;tries++){
      const idx=ps.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,nt);
      ps.forEach((q,i)=>q.t=idx.includes(i)?'t':'s');
      if(feasible(1))break;
    }
    G.phase='play';G.turn=0;
  }else if(G.setupP==0){G.setupP=1}
  else{G.phase='play';G.turn=0}
  toast('');render();
}
const occ=(x,r)=>G.pcs.find(q=>q.x==x&&q.r==r);
const enemy=p=>G.hive[G.home[p]=='T'?'B':'T'];
function rawDest(q){
  let c=[];
  if(q.t=='t')c=(q.d=='dn'?DN:UP).map(([dx,dy])=>[q.x+dx,q.r+dy]);
  else for(const [dx,dy] of STAR){
    const a=[q.x+dx,q.r+dy];
    if(q.t=='q'&&occ(a[0],a[1]))c.push([a[0]+dx,a[1]+dy]);
    else c.push(a);
  }
  return c;
}
function inEnemy(q){return enemy(q.p).has(key(q.x,q.r))}
function isFrozen(q){return q.frz===0}
function applyFreezeTransition(q,wasIn,viaPush){
  if(!RULES.freeze)return;
  const isIn=inEnemy(q);
  if(!wasIn&&isIn)q.frz=q.exp?0:(q.t=='s'?1:2);
  else if(wasIn&&!isIn){q.frz=null;if(viaPush)q.exp=true}
  else if(wasIn&&isIn&&q.frz>0)q.frz--;
}
function moves(q){
  if(isFrozen(q))return [];
  const en=enemy(q.p),inEn=en.has(key(q.x,q.r));
  return rawDest(q).filter(([x,r])=>{
    const k=key(x,r);
    return G.cells.has(k)&&!occ(x,r)&&(RULES.free||!inEn||en.has(k));
  });
}
function pushDests(q){
  if(q.t!='q'||isFrozen(q))return [];
  if(!(G.hive.T.has(key(q.x,q.r))||G.hive.B.has(key(q.x,q.r))))return [];
  const out=[];
  for(const [dx,dy] of STAR){
    const nx=q.x+dx,nr=q.r+dy,t=occ(nx,nr);
    if(!t)continue;
    if(t.t=='t'){
      for(const [ddx,ddy] of (t.d=='dn'?DN:UP)){
        const fx=t.x+ddx,fr=t.r+ddy;
        if(!G.cells.has(key(fx,fr))||occ(fx,fr))continue;
        out.push({t,fx,fr,dx:ddx,dy:ddy});
      }
    }else{
      const fx=nx+dx,fr=nr+dy;
      if(!G.cells.has(key(fx,fr))||occ(fx,fr))continue;
      out.push({t,fx,fr,dx,dy});
    }
  }
  return out;
}
function legal(p){
  const mv=G.pcs.filter(q=>q.p==p&&!isFrozen(q)&&(moves(q).length||(RULES.turn&&q.t=='t')||pushDests(q).length));
  const en=enemy(p),outside=G.pcs.filter(q=>q.p==p&&!en.has(key(q.x,q.r)));
  const lastOut=outside.length==1?outside[0]:null;
  const active=G.pcs.filter(q=>q.p==p&&!isFrozen(q));
  const soleActive=active.length==1?active[0]:null;
  const fresh=mv.filter(q=>RULES.rep||q.id!=G.last[p]||q===lastOut||q===soleActive);
  return fresh.length?fresh:mv;
}
function vibrate(p){
  try{if(typeof navigator!='undefined'&&navigator.vibrate)navigator.vibrate(p)}catch(e){}
}
function doMove(q,x,r){
  toast('');G.hint=null;
  const wasIn=inEnemy(q);
  G.mc=G.mc||[0,0];G.mc[q.p]++;
  G.lastMove={id:q.id,p:q.p,fromX:q.x,fromR:q.r,toX:x,toR:r};
  q.x=x;q.r=r;G.last[q.p]=q.id;G.sel=null;
  maybeConvert(q,wasIn);
  applyFreezeTransition(q,wasIn,false);
  const en=enemy(q.p);
  Music.move(q.p,en.has(key(x,r)));
  if(G.pcs.filter(a=>a.p==q.p).every(a=>en.has(key(a.x,a.r)))){
    G.winner=q.p;G.winBy='deliver';G.score[q.p]++;G.phase='over';G.winFlash=true;
    G.matchOver=G.mm=='classic'&&(G.score[q.p]>=2||G.round>=3);
    Music.win();vibrate([25,40,70]);
    return render();
  }
  passTurn(q);
}
function doPush(q,pd){
  toast('');G.hint=null;
  const t=pd.t,wasInT=inEnemy(t),wasInQ=inEnemy(q);
  G.mc=G.mc||[0,0];G.mc[q.p]++;
  G.lastMove={id:q.id,p:q.p,fromX:q.x,fromR:q.r,toX:q.x,toR:q.r,pushFromX:t.x,pushFromR:t.r,pushToX:pd.fx,pushToR:pd.fr};
  t.x=pd.fx;t.r=pd.fr;
  G.last[q.p]=q.id;G.sel=null;
  applyFreezeTransition(t,wasInT,true);
  applyFreezeTransition(q,wasInQ,false);
  Music.move(q.p,false);
  if(won(t.p)){
    G.winner=t.p;G.winBy='deliver';G.score[t.p]++;G.phase='over';G.winFlash=true;
    G.matchOver=G.mm=='classic'&&(G.score[t.p]>=2||G.round>=3);
    Music.win();vibrate([25,40,70]);
    return render();
  }
  passTurn(q);
}
function posSig(){
  return G.pcs.map(q=>q.x+'.'+q.r+(q.t=='t'?q.d[0]:'')+(q.frz==null?'':'f'+q.frz)).join('|')+'#'+G.turn;
}
function checkRepeat(){
  if(G.phase!='play')return;
  const s=posSig(),c=(G.rep.get(s)||0)+1;
  G.rep.set(s,c);
  if(c>=3){G.winner=-2;G.phase='over';G.matchOver=G.mm=='classic'&&G.round>=3;toast('')}
}
function pieceDist(q){
  const dm=G.dist[(q.t=='t'?q.d:'s')+(G.home[q.p]=='T'?'B':'T')].get(key(q.x,q.r));
  let best=Infinity;
  for(const c of (G.home[q.p]=='T'?G.B:G.T)){
    const d=dm.get(key(c[0],c[1]));
    if(d!==undefined&&d<best)best=d;
  }
  return best;
}
function lastUndelivered(p){
  const en=enemy(p),out=G.pcs.filter(q=>q.p==p&&!en.has(key(q.x,q.r)));
  return out.length==1?out[0]:null;
}
function checkHopeless(n){
  const w=1-n,Wp=lastUndelivered(w),Lp=lastUndelivered(n);
  if(!Wp||!Lp)return null;
  if(pieceDist(Wp)!=1)return null;
  const enW=enemy(w);
  if(!moves(Wp).some(m=>enW.has(key(m[0],m[1]))))return null;
  if(pieceDist(Lp)<3)return null;
  for(const [q,x,r] of aiMoves(n)){
    let stillWins;
    if(x=='push'){
      const t=r.t,tx=t.x,tr=t.r;
      t.x=r.fx;t.r=r.fr;
      stillWins=moves(Wp).some(m=>enW.has(key(m[0],m[1])));
      t.x=tx;t.r=tr;
    }else if(x==null){
      stillWins=moves(Wp).some(m=>enW.has(key(m[0],m[1])));
    }else{
      const ox=q.x,or_=q.r;
      q.x=x;q.r=r;
      stillWins=moves(Wp).some(m=>enW.has(key(m[0],m[1])));
      q.x=ox;q.r=or_;
    }
    if(!stillWins)return null;
  }
  return {winner:w,loser:n};
}
function delivered(p){const en=enemy(p);return G.pcs.filter(a=>a.p==p&&en.has(key(a.x,a.r))).length}
function checkProgress(){
  let prog=false;
  for(let p=0;p<2;p++){const d=delivered(p);if(d>G.best[p]){G.best[p]=d;prog=true}}
  G.np=prog?0:(G.np||0)+1;
  if(G.np>=NP_LIMIT){G.winner=-3;G.winBy=null;G.phase='over';G.hopelessOffer=null;G.matchOver=G.mm=='classic'&&G.round>=3;toast('');return true}
  return false;
}
function passTurn(q){
  if(checkProgress())return render();
  const n=1-q.p;
  if(!legal(n).length){
    if(!RULES.freeze){
      G.turn=q.p;
      if(!legal(q.p).length){G.winner=-1;G.phase='over';G.matchOver=G.mm=='classic'&&G.round>=3;toast('');return render()}
      toast(cap(N[n])+' не могут ходить — '+N[q.p]+' ходят снова');
      checkRepeat();
      return render();
    }
    G.winner=q.p;G.winBy='stuck';G.score[q.p]++;G.phase='over';G.winFlash=true;
    G.matchOver=G.mm=='classic'&&(G.score[q.p]>=2||G.round>=3);
    Music.win();vibrate([25,40,70]);
    return render();
  }
  const hop=checkHopeless(n);
  G.hopelessOffer=null;
  if(hop){
    if(vsAI&&n==1){
      G.winner=hop.winner;G.winBy='hopeless';G.score[hop.winner]++;G.phase='over';G.winFlash=true;
      G.matchOver=G.mm=='classic'&&(G.score[hop.winner]>=2||G.round>=3);
      Music.win();vibrate([25,40,70]);
      return render();
    }
    G.hopelessOffer=hop;
  }
  G.turn=n;
  checkRepeat();
  render();
}
function concedeHopeless(){
  const hop=G.hopelessOffer;
  if(!hop||G.phase!='play')return;
  G.hopelessOffer=null;
  G.winner=hop.winner;G.winBy='hopeless';G.score[hop.winner]++;G.phase='over';G.winFlash=true;
  G.matchOver=G.mm=='classic'&&(G.score[hop.winner]>=2||G.round>=3);
  Music.win();vibrate([25,40,70]);
  render();
}
function dismissHopeless(){G.hopelessOffer=null;render()}
function doTurn(q){
  toast('');G.hint=null;
  const wasIn=inEnemy(q);
  G.lastMove={id:q.id,p:q.p,fromX:q.x,fromR:q.r,toX:q.x,toR:q.r};
  q.d=q.d=='up'?'dn':'up';G.last[q.p]=q.id;G.sel=null;
  applyFreezeTransition(q,wasIn,false);
  G.mc=G.mc||[0,0];G.mc[q.p]++;q.tn=G.mc[q.p];
  Music.move(q.p,false);
  passTurn(q);
}

function nextRound(){
  const L=1-G.winner;
  G.round++;G.home=[G.home[1],G.home[0]];
  const home=G.hive[G.home[L]];
  const free=[...home].filter(k=>!occ(...k.split(',').map(Number)));
  const out=G.pcs.filter(q=>q.p==L&&!home.has(key(q.x,q.r)));
  for(let tries=0;tries<300;tries++){
    const f=free.slice().sort(()=>Math.random()-.5);
    out.forEach((q,i)=>{const [x,r]=f[i].split(',').map(Number);q.x=x;q.r=r});
    if(feasible(L))break;
  }
  G.pcs.forEach(q=>{q.frz=null;q.exp=false});
  G.turn=L;G.last=[-1,-1];G.sel=null;G.phase='play';G.rep=new Map();G.lastMove=null;G.winFlash=false;G.winBy=null;G.hopelessOffer=null;pcPrev.clear();
  G.np=0;G.best=[delivered(0),delivered(1)];G.ended=false;G.undo=[];G.hint=null;
  const bad=[0,1].filter(p=>!feasible(p));
  toast((out.length?'Фигуры, не успевшие войти в улей, расставлены на свободные места случайно. ':'')+(bad.length?'Внимание: '+bad.map(p=>N[p]).join(' и ')+' уже не смогут занять улей соперника, потому что не все их трутни дойдут до нужных клеток.':''));
  render();
}
svg.addEventListener('click',e=>{
  const pe=e.target.closest('[data-id]'),ce=e.target.closest('[data-k]'),te=e.target.closest('[data-turn]'),phe=e.target.closest('[data-push]');
  if(G.phase=='setup'){
    if(!pe)return;
    const q=G.pcs[+pe.dataset.id];
    if(q.p!=G.setupP)return;
    toast('');
    if(G.sel==null){G.sel=q.id;Music.select()}
    else if(G.sel==q.id){G.sel=null;Music.select()}
    else{
      const a=G.pcs[G.sel];
      const tx=a.x,tr=a.r;
      a.x=q.x;a.r=q.r;q.x=tx;q.r=tr;
      G.sel=null;Music.move(q.p,false);
    }
    return render();
  }
  if(G.phase!='play'||(vsAI&&G.turn==1))return;
  if(phe){
    const q=G.sel!=null?G.pcs[G.sel]:null;
    if(q&&q.p==G.turn){
      const pkey=phe.dataset.push;
      const pd=pushDests(q).find(d=>(d.t.id+'_'+d.fx+'_'+d.fr)===pkey);
      if(pd){vibrate(15);pushUndo();doPush(q,pd)}
    }
    return;
  }
  if(te){
    const q=G.pcs[+te.dataset.turn];
    if(RULES.turn&&q.t=='t'&&q.p==G.turn&&G.sel==q.id&&legal(q.p).includes(q)){vibrate(15);pushUndo();doTurn(q)}
    return;
  }
  if(pe){
    const q=G.pcs[+pe.dataset.id];
    if(q.p==G.turn){
      if(legal(q.p).includes(q)){if(G.hint&&G.hint.id!=q.id)G.hint=null;G.sel=q.id;toast('');Music.select()}
      else if(isFrozen(q))toast('Эта фигура застыла в улье соперника и до конца раунда не может ходить — сдвинуть её может только толчок королевы.');
      else if(q.id==G.last[q.p]&&(moves(q).length||pushDests(q).length))toast('Этой фигурой уже ходили — выберите другую');
      else toast(q.t=='t'&&RULES.turn?'Этой фигурой уже ходили — выберите другую':'Эта фигура сейчас не может ходить');
    }
    return render();
  }
  if(ce&&G.sel!=null){
    const [x,r]=ce.dataset.k.split(',').map(Number);
    const q=G.pcs[G.sel];
    if(moves(q).some(m=>m[0]==x&&m[1]==r)){vibrate(15);pushUndo();return doMove(q,x,r)}
    G.sel=null;render();
  }
});
const Music=(()=>{

    const v=localStorage.getItem('ulei-vol');if(v!==null&&!isNaN(+v))vol=Math.min(1,Math.max(0,+v));
    const m=localStorage.getItem('ulei-style');if(m==='asia'||m==='space'||m==='nature')style=m;
  }catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);

  const pick=a=>a[Math.floor(Math.random()*a.length)];
  function impulse(sec,dec){
    const n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(1,n,ctx.sampleRate);
    for(let c=0;c<1;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}
    return b;
  }
  function build(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;

    const verb=ctx.createConvolver();verb.buffer=impulse(1.8,2.6);
    const wet=ctx.createGain();wet.gain.value=.7;
    const dry=ctx.createGain();dry.gain.value=.55;
    bus=ctx.createGain();
    bus.connect(dry);bus.connect(verb);verb.connect(wet);
    dry.connect(lp);wet.connect(lp);lp.connect(master);master.connect(ctx.destination);
    // звуки хода: отдельный тракт, не зависит от музыки
    sfxIn=ctx.createGain();
    const sl=ctx.createBiquadFilter();sl.type='lowpass';sl.frequency.value=2600;
    const sd=ctx.createGain();sd.gain.value=.8;
    const sv=ctx.createConvolver();sv.buffer=impulse(.9,3);
    const sw=ctx.createGain();sw.gain.value=.35;
    sfxIn.connect(sl);sl.connect(sd);sd.connect(ctx.destination);sl.connect(sv);sv.connect(sw);sw.connect(ctx.destination);
    // шум для ветра, воды и космического фона
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    return true;
  }
  function noiseSrc(){const n=ctx.createBufferSource();n.buffer=noiseBuf;n.loop=true;n.start();live.push(n);return n}
  function lfo(freq,depth,param){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=freq;g.gain.value=depth;o.connect(g);g.connect(param);o.start();live.push(o);
  }
  function panTo(out){
    if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=rnd(-.7,.7);p.connect(out);return p}
    return out;
  }
  function voice(f,t,dur,att,peak,type,det,out,cut){
    const g=ctx.createGain(),o=ctx.createOscillator();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(peak,t+att);
    g.gain.setValueAtTime(peak,t+dur*.45);
    g.gain.linearRampToValueAtTime(0,t+dur);
    o.type=type;o.frequency.value=f;o.detune.value=det;
    o.connect(g);
    if(cut){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cut;g.connect(lp);lp.connect(out)}else g.connect(out);
    o.start(t);o.stop(t+dur+.2);
  }
  function ring(f,t,parts,out,att){
    const dst=panTo(out);
    parts.forEach(([k,pk,d])=>{
      const g=ctx.createGain(),o=ctx.createOscillator();
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+(att||.02));g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.type='sine';o.frequency.value=f*k;o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.1);
    });
  }

  /* ---------- японская медитация: ветер, сякухати, фурин, кото ---------- */
  const MIYAKO=[62,63,67,69,70,74,75,79,81,82];
  function pluck(t,f,pk,out){
    const dur=3.4,g=ctx.createGain(),g2=ctx.createGain(),o=ctx.createOscillator(),o2=ctx.createOscillator(),lp=ctx.createBiquadFilter();
    lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(500,t+dur*.6);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.type='triangle';o.frequency.setValueAtTime(f*1.012,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);
    o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.3;
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(lp);lp.connect(panTo(out));
    o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
  }
  function flute(f,t,dur,pk,out){
    const att=.42,rel=1.1,end=t+dur,stop=end+rel+.3;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+att);g.gain.setValueAtTime(pk*.85,t+dur*.6);g.gain.linearRampToValueAtTime(0,end+rel);
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g2=ctx.createGain();
    o.type='sine';o2.type='triangle';g2.gain.value=.14;
    o.frequency.setValueAtTime(f*.972,t);o.frequency.exponentialRampToValueAtTime(f,t+.3);
    o2.frequency.setValueAtTime(f*2*.972,t);o2.frequency.exponentialRampToValueAtTime(f*2,t+.3);
    const v=ctx.createOscillator(),vg=ctx.createGain();
    v.frequency.value=4.6+Math.random()*1.2;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(14,t+dur*.7);
    v.connect(vg);vg.connect(o.detune);vg.connect(o2.detune);
    o.connect(g);o2.connect(g2);g2.connect(g);
    const nz=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();
    nz.buffer=noiseBuf;nz.loop=true;bp.type='bandpass';bp.frequency.value=f*1.02;bp.Q.value=7;
    ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(pk*2.4,t+att*.8);ng.gain.setValueAtTime(pk*1.5,t+dur*.6);ng.gain.linearRampToValueAtTime(0,end+rel*.8);
    nz.connect(bp);bp.connect(ng);ng.connect(g);
    g.connect(panTo(out));
    o.start(t);o2.start(t);v.start(t);nz.start(t,Math.random()*1.4);
    o.stop(stop);o2.stop(stop);v.stop(stop);nz.stop(stop);
  }
  function chime(t,out){
    ring(rnd(2300,3900),t,[[1,.02,2.8],[2.76,.008,1.7],[5.4,.004,.9]],out,.004);
  }
  const ASIA={
    init(t,out){
      const n=noiseSrc(),bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=620;bp.Q.value=.7;
      const wg=ctx.createGain();wg.gain.value=.014;lfo(.055,.006,wg.gain);
      n.connect(bp);bp.connect(wg);wg.connect(out);lfo(.03,160,bp.frequency);
      const n2=noiseSrc(),hp=ctx.createBiquadFilter();hp.type='bandpass';hp.frequency.value=2500;hp.Q.value=1.1;
      const g2=ctx.createGain();g2.gain.value=.004;lfo(.08,.003,g2.gain);
      n2.connect(hp);hp.connect(g2);g2.connect(out);
      st={wg,gs:t+3,d:t,f:t+2.5,c:t+8,k:t+14,b:t+24};
    },
    tick(now,out){
      while(st.gs<now+2){
        st.wg.gain.setTargetAtTime(rnd(.026,.04),st.gs,1.6);
        st.wg.gain.setTargetAtTime(.012,st.gs+4.5,2.2);
        st.gs+=rnd(9,17);
      }
      while(st.d<now+2){
        voice(hz(38),st.d,30,9,.03,'sine',0,out);voice(hz(45),st.d+2,30,9,.016,'sine',3,out);
        st.d+=24;
      }
      while(st.f<now+2){
        let i=1+Math.floor(Math.random()*4),tt=st.f;const n=2+Math.floor(Math.random()*3);
        for(let k=0;k<n;k++){
          const dur=rnd(2.6,4.6);
          flute(hz(MIYAKO[i]),tt,dur,.05,out);
          i=Math.min(MIYAKO.length-1,Math.max(0,i+pick([-2,-1,-1,1,2])));
          tt+=dur+rnd(.3,1.1);
        }
        st.f=tt+rnd(5,10);
      }
      while(st.c<now+2){
        const n=1+Math.floor(Math.random()*3);
        for(let i=0;i<n;i++)chime(st.c+i*rnd(.18,.7),out);
        st.c+=rnd(12,24);
      }
      while(st.k<now+2){
        let i=2+Math.floor(Math.random()*3),tt=st.k;const n=2+Math.floor(Math.random()*3);
        for(let k=0;k<n;k++){
          pluck(tt,hz(MIYAKO[i]-12),rnd(.03,.045),out);
          i=Math.min(MIYAKO.length-1,Math.max(0,i+pick([-2,-1,1,2])));tt+=rnd(.7,1.3);
        }
        st.k+=rnd(18,32);
      }
      while(st.b<now+2){
        ring(hz(pick([50,57,45])),st.b,[[1,.05,12],[2.76,.02,8],[5.4,.006,5]],out);
        st.b+=rnd(38,55);
      }
    }
  };

  /* ---------- космическая медитация: спейс-эмбиент ---------- */
  const CS=[[33,45,52,59,64],[29,41,48,55,60],[36,48,55,59,62],[40,47,52,55,59]];
  const SPACE={
    init(t,out){
      const padLp=ctx.createBiquadFilter();padLp.type='lowpass';padLp.frequency.value=850;padLp.Q.value=.8;lfo(.035,400,padLp.frequency);
      const padBus=ctx.createGain();padBus.connect(padLp);padLp.connect(out);
      const dl=ctx.createDelay(3);dl.delayTime.value=.75;
      const fb=ctx.createGain();fb.gain.value=.46;const dg=ctx.createGain();dg.gain.value=.6;
      dl.connect(fb);fb.connect(dl);dl.connect(dg);dg.connect(out);
      const arpBus=ctx.createGain();arpBus.connect(out);arpBus.connect(dl);
      const n=noiseSrc(),hb=ctx.createBiquadFilter();hb.type='bandpass';hb.frequency.value=3200;hb.Q.value=.9;
      const hg=ctx.createGain();hg.gain.value=.0035;lfo(.04,.002,hg.gain);
      n.connect(hb);hb.connect(hg);hg.connect(out);
      st={c:t,ci:0,a:t+7,ai:0,cur:CS[0],padBus,arpBus};
    },
    tick(now,out){
      while(st.c<now+2){
        const ch=CS[st.ci++%CS.length];st.cur=ch;
        ch.forEach(m=>{
          voice(hz(m),st.c,32,9,.005,'sawtooth',-7,st.padBus);
          voice(hz(m),st.c,32,9,.005,'sawtooth',7,st.padBus);
          voice(hz(m),st.c,32,9,.011,'sine',0,out);
        });
        voice(hz(ch[0]-12),st.c,32,7,.05,'sine',0,out);
        voice(hz(ch[3]+24),st.c+3,26,10,.003,'sine',0,out);
        st.c+=20;
      }
      while(st.a<now+2){
        const notes=st.cur.slice(1).flatMap(m=>[m+12,m+24]),pat=[0,2,1,3,2,4,3,1],n=16+Math.floor(Math.random()*9);
        let tt=st.a;
        for(let i=0;i<n;i++){
          if(Math.random()<.1){tt+=.5;continue}
          const f=hz(notes[(pat[i%8]+(i>>3))%notes.length]);
          const g=ctx.createGain(),o=ctx.createOscillator(),o2=ctx.createOscillator(),g2=ctx.createGain();
          o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;g2.gain.value=.4;
          g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.02,tt+.02);g.gain.exponentialRampToValueAtTime(.0001,tt+1.1);
          o.connect(g);o2.connect(g2);g2.connect(g);g.connect(st.arpBus);
          o.start(tt);o2.start(tt);o.stop(tt+1.2);o2.stop(tt+1.2);
          tt+=.5;
        }
        st.a=tt+rnd(8,14);
      }
    }
  };

  /* ---------- природная медитация ---------- */
  const CN=[[45,52,57,61],[43,50,55,62]];
  function bird(t,out){
    const n=2+Math.floor(Math.random()*4),base=rnd(2400,4300),dst=panTo(out);let tt=t;
    for(let i=0;i<n;i++){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(base*(1+i*.02),tt);o.frequency.exponentialRampToValueAtTime(base*rnd(.75,1.35),tt+.07);
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.018,tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+.09);
      o.connect(g);g.connect(dst);o.start(tt);o.stop(tt+.12);tt+=rnd(.1,.16);
    }
  }
  function dove(t,out){
    const f0=rnd(330,420),dst=panTo(out);
    [[0,1],[.6,1],[1.2,.93]].forEach(([dt,k])=>{
      const o=ctx.createOscillator(),g=ctx.createGain(),tt=t+dt;
      o.type='sine';o.frequency.setValueAtTime(f0*k,tt);o.frequency.exponentialRampToValueAtTime(f0*k*.92,tt+.45);
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.03,tt+.08);g.gain.exponentialRampToValueAtTime(.0001,tt+.5);
      o.connect(g);g.connect(dst);o.start(tt);o.stop(tt+.6);
    });
  }
  function drop(t,out){
    const f=rnd(650,1500),o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.7,t+.07);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.014,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.connect(g);g.connect(panTo(out));o.start(t);o.stop(t+.35);
  }
  const NATURE={
    init(t,out){
      const n1=noiseSrc(),bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.5;
      const g1=ctx.createGain();g1.gain.value=.035;lfo(.17,.012,g1.gain);
      n1.connect(bp);bp.connect(g1);g1.connect(out);
      const n2=noiseSrc(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;
      const g2=ctx.createGain();g2.gain.value=.05;lfo(.06,.02,g2.gain);
      n2.connect(lp);lp.connect(g2);g2.connect(out);
      st={b:t+2,d:t+.5,v:t+12,p:t,ci:0};
    },
    tick(now,out){
      while(st.p<now+2){
        CN[st.ci++%CN.length].forEach(m=>voice(hz(m),st.p,22,6,.011,'sine',0,out));
        st.p+=16;
      }
      while(st.b<now+2){bird(st.b,out);st.b+=rnd(3,8)}
      while(st.d<now+2){drop(st.d,out);st.d+=rnd(.5,2.4)}
      while(st.v<now+2){dove(st.v,out);st.v+=rnd(25,40)}
    }
  };
  const STY={asia:ASIA,space:SPACE,nature:NATURE};

  function tick(tt){if(sg)STY[style].tick(tt===undefined||typeof tt!='number'?ctx.currentTime:tt,sg)}
  function useStyle(){
    const t=ctx.currentTime;
    if(sg){
      const o=sg,ol=live;live=[];
      o.gain.cancelScheduledValues(t);o.gain.setValueAtTime(o.gain.value,t);o.gain.linearRampToValueAtTime(0,t+2.5);
      setTimeout(()=>{ol.forEach(x=>{try{x.stop()}catch(e){}});try{o.disconnect()}catch(e){}},3000);
    }
    sg=ctx.createGain();sg.gain.setValueAtTime(0,t);sg.gain.linearRampToValueAtTime(1,t+3);sg.connect(bus);
    sgStyle=style;
    STY[style].init(t+.1,sg);
    if(running)tick();
  }
  function ramp(to,sec){
    const t=ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value,t);
    master.gain.linearRampToValueAtTime(to,t+sec);
  }
  function unlock(){
    if(!ctx&&!build())return;
    if(ctx.state!=='running'&&ctx.resume)ctx.resume();
  }
  function start(){
    unlock();if(!ctx)return;
    clearTimeout(stopT);
    if(!sg||sgStyle!==style)useStyle();
    if(!running){running=true;timer=setInterval(tick,500);tick()}
    ramp(vol*.95,4);
  }
  function stop(){
    if(!ctx||!running)return;
    ramp(0,1.2);
    clearInterval(timer);running=false;
    stopT=setTimeout(()=>{
      live.forEach(x=>{try{x.stop()}catch(e){}});live=[];
      if(sg){try{sg.disconnect()}catch(e){}sg=null}
    },1400);
  }
  function setStyle(n){
    style=n;
    try{localStorage.setItem('ulei-style',n)}catch(e){}
    if(ctx&&running)useStyle();
  }
  document.addEventListener('visibilitychange',()=>{
    if(!ctx)return;
    if(document.hidden){ctx.suspend()}else{ctx.resume()}
  });

  /* ---------- звуки хода ---------- */
  function tap(t,f,pk,d){
    [[1,pk,d],[3.98,pk*.22,d*.25]].forEach(([k,a,dd])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f*k;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dd);
      o.connect(g);g.connect(sfxIn);o.start(t);o.stop(t+dd+.05);
    });
  }
  function clack(t,f,pk,d){
    const src=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();
    src.buffer=noiseBuf;bp.type='bandpass';bp.frequency.value=Math.min(2400,f*2.2);bp.Q.value=5;
    ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(pk*1.6,t+.002);ng.gain.exponentialRampToValueAtTime(.0001,t+d*.6);
    src.connect(bp);bp.connect(ng);ng.connect(sfxIn);src.start(t,Math.random()*1.5);src.stop(t+d);
    [[1,pk,d],[2.4,pk*.3,d*.5]].forEach(([k,a,dd])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(f*k*1.12,t);o.frequency.exponentialRampToValueAtTime(f*k,t+.02);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dd);
      o.connect(g);g.connect(sfxIn);o.start(t);o.stop(t+dd+.03);
    });
  }
  function ready(){
    if(!sfxOn||!ctx)return false;
    if(ctx.state!=='running'&&ctx.resume)ctx.resume();
    return true;
  }
  function move(p,entered){
    if(!ready())return;
    const t=ctx.currentTime+.01;
    if(sfxStyle=='wood'){
      const base=pick(p==0?[860,940,1020]:[640,700,760]);
      clack(t,base,.05,.1);
      clack(t+rnd(.055,.085),base*rnd(.92,1.08),.035,.09);
      if(entered)clack(t+.19,base*.7,.03,.12);
    }else{
      const f=hz(pick(p==0?[72,74,76,79,81]:[62,64,67,69,71]));
      tap(t,f,.075,.4);
      if(entered)tap(t+.09,f*1.5,.04,.5);
    }
  }
  function select(){
    if(!ready())return;
    const t=ctx.currentTime+.005;
    if(sfxStyle=='wood')clack(t,1250,.03,.06);
    else tap(t,hz(84),.04,.22);
  }
  function win(){
    if(!ready())return;
    const t=ctx.currentTime+.25;
    if(sfxStyle=='wood')[0,1,2,3].forEach(i=>clack(t+i*.12,700+i*140,.035,.12));
    else[72,76,79,84].forEach((m,i)=>tap(t+i*.18,hz(m),.05,1.4));
  }
  return{
    start,stop,unlock,setStyle,move,select,win,
    playing:()=>running&&ctx&&ctx.state=='running',
    vol:()=>vol,
    style:()=>style,
    setVol(v){
      vol=Math.min(1,Math.max(0,v));
      try{localStorage.setItem('ulei-vol',String(vol))}catch(e){}
      if(ctx&&running)master.gain.setTargetAtTime(vol*.95,ctx.currentTime,.15);
    }
  };
})();
function toggleMusic(){
  musicOn=!musicOn;
  try{localStorage.setItem('ulei-music',musicOn?'1':'0')}catch(e){}
  if(musicOn)Music.start();else Music.stop();
  render();
}
function pickStyle(n){
  musicOn=true;
  try{localStorage.setItem('ulei-music','1')}catch(e){}
  Music.setStyle(n);Music.start();render();
}
function pickSfx(n){
  sfxStyle=n;sfxOn=true;
  try{localStorage.setItem('ulei-sfxstyle',n);localStorage.setItem('ulei-sfx','1')}catch(e){}
  Music.unlock();Music.move(0,false);render();
}
function toggleAllSound(){
  const on=!(musicOn||sfxOn);
  musicOn=on;sfxOn=on;
  try{localStorage.setItem('ulei-music',on?'1':'0');localStorage.setItem('ulei-sfx',on?'1':'0')}catch(e){}
  if(on){Music.unlock();Music.start()}else Music.stop();
  render();
}
function toggleSfx(){
  sfxOn=!sfxOn;
  try{localStorage.setItem('ulei-sfx',sfxOn?'1':'0')}catch(e){}
  if(sfxOn){Music.unlock();Music.move(0,false)}
  render();
}
['pointerdown','click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,e=>{
  if(byeOn)return;

function chipHTML(p){return '<span class="chip" style="background:'+CHIP[theme][p]+'"></span>'}
function scoreHTML(){return chipHTML(0)+' '+G.score[0]+' : '+G.score[1]+' '+chipHTML(1)}
function overText(){
  const sc=scoreHTML();
  if(G.matchOver){
    const a=G.score[0],b=G.score[1];
    if(a==b)return 'Матч окончен вничью, счёт '+sc+'.';
    const w=a>b?0:1;
    return 'Матч окончен: победили '+nm(w)+' '+chipHTML(w)+', счёт '+sc+'.';
  }
  if(G.winner==-2)return 'Ничья в раунде: позиция повторилась трижды. Счёт '+sc+'. Что дальше?';
  if(G.winner==-1)return 'Ничья в раунде: ни у кого нет ходов. Счёт '+sc+'. Что дальше?';

function buildDist(cells){
  const kinds={s:STAR,dn:DN,up:UP},out={};
  for(const k in kinds)for(const h of ['T','B']){
    const m=new Map();
    for(const from of cells){
      const d=new Map([[from,0]]),qu=[from];
      for(let i=0;i<qu.length;i++){
        if(i>0&&G.hive[h].has(qu[i]))continue;
        const [x,r]=qu[i].split(',').map(Number);
        for(const [dx,dy] of kinds[k]){

function cost(q,oc,slack,sIn){
  const en=enemy(q.p);
  if(en.has(key(q.x,q.r)))return -8;
  const dm=G.dist[(q.t=='t'?q.d:'s')+(G.home[q.p]=='T'?'B':'T')].get(key(q.x,q.r));
  let best=40;
  for(const c of (G.home[q.p]=='T'?G.B:G.T)){
    const k=key(c[0],c[1]);
    if(oc.has(k))continue;
    let d=dm.get(k);
    if(d===undefined)continue;
    const cl=c[0]%3;
    if(q.t!='t'&&sIn[cl]>=Math.max(0,slack[cl]))d+=2;
    if(d<best)best=d;
  }

}
function ev(me){
  const oc=[new Set(),new Set()],slack=[[0,0,0],[0,0,0]],sIn=[[0,0,0],[0,0,0]];
  for(let p=0;p<2;p++)for(const k of enemy(p))slack[p][+k.split(',')[0]%3]++;
  for(const q of G.pcs){
    const inside=enemy(q.p).has(key(q.x,q.r));
    if(inside)oc[q.p].add(key(q.x,q.r));
    if(q.t=='t')slack[q.p][q.x%3]--;
    else if(inside)sIn[q.p][q.x%3]++;
  }
  let s=0;
  for(const q of G.pcs)s+=(q.p==me?-1:1)*cost(q,oc[q.p],slack[q.p],sIn[q.p]);
  for(let p=0;p<2;p++)for(let c=0;c<3;c++){
    const over=Math.max(0,sIn[p][c]-Math.max(0,slack[p][c]));
    s+=(p==me?-1:1)*14*over;
  }

}

function ab(d,p,me,a,b){
  const ms=aiMoves(p);
  if(!ms.length)return (p==me?-1:1)*(1000+d);
  if(d==0)return ev(me);
  const maxi=p==me;
  let best=maxi?-Infinity:Infinity;
  for(const [q,x,r] of ms){

      const t=r.t,tx=t.x,tr=t.r,ol=G.last[p];
      const wasInT=inEnemy(t),wasInQ=inEnemy(q),tfrz=t.frz,texp=t.exp,qfrz=q.frz,qexp=q.exp;
      t.x=r.fx;t.r=r.fr;G.last[p]=q.id;
      applyFreezeTransition(t,wasInT,true);applyFreezeTransition(q,wasInQ,false);
      v=won(t.p)?(t.p==me?1:-1)*(1000+d):ab(d-1,1-p,me,a,b);
      t.x=tx;t.r=tr;G.last[p]=ol;t.frz=tfrz;t.exp=texp;q.frz=qfrz;q.exp=qexp;

    }

  const d=aiDepth();
  let best=null,bv=-Infinity;

    let v;

      const t=r.t,tx=t.x,tr=t.r,ol=G.last[p];
      const wasInT=inEnemy(t),wasInQ=inEnemy(q),tfrz=t.frz,texp=t.exp,qfrz=q.frz,qexp=q.exp;
      t.x=r.fx;t.r=r.fr;G.last[p]=q.id;
      applyFreezeTransition(t,wasInT,true);applyFreezeTransition(q,wasInQ,false);
      v=won(t.p)?(t.p==p?5000:-5000):ab(d,o,p,-Infinity,Infinity);
      v-=repPen(o);
      t.x=tx;t.r=tr;G.last[p]=ol;t.frz=tfrz;t.exp=texp;q.frz=qfrz;q.exp=qexp;
    }else{
      const ol=G.last[p],od=q.d,ox=q.x,or=q.r,wasIn=inEnemy(q),qfrz=q.frz,qexp=q.exp,qt=q.t,qmade=G.queenMade[p];

      G.last[p]=q.id;
      if(x!=null)maybeConvert(q,wasIn);

function centerLogo(root){
  try{
    const ttl=root.querySelector&&root.querySelector('#ttl');
    if(!ttl)return;
    const t=ttl.querySelector('text:last-child'),svgEl=root.querySelector('svg');
    if(!t||!t.getStartPositionOfChar)return;
    const probe=t.cloneNode(false);
    probe.removeAttribute('letter-spacing');probe.textContent='О';
    svgEl.appendChild(probe);
    const w0=probe.getComputedTextLength();
    svgEl.removeChild(probe);
    const cx=t.getStartPositionOfChar(1).x+w0/2;
    if(w0>0&&isFinite(cx))ttl.setAttribute('transform','translate('+(200-cx).toFixed(1)+' 0)');
  }catch(e){}
}

function woodSVG(){
  const W2=1600,H2=1000,n=5,ph=H2/n,rnd=rng(77);
  const base=['#7b4e27','#84562c','#744823','#7e512a','#70441f'];

  const dark='0 0 0 0 .12 0 0 0 0 .06 0 0 0 0 .02 3.4 0 0 0 -1.7',lite='0 0 0 0 .87 0 0 0 0 .65 0 0 0 0 .4 -3.4 0 0 0 1.5';
  let g='<defs>'+fd('d0',4,11,dark)+fd('d1',17,23,dark)+fd('d2',29,5,dark)+fd('l0',8,31,lite)+fd('l1',41,13,lite)
    +'<radialGradient id="bl"><stop offset="0" stop-color="#ffd29a" stop-opacity=".13"/><stop offset="1" stop-color="#ffd29a" stop-opacity="0"/></radialGradient>'
    +'<radialGradient id="bd"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>'
    +'<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>';
  for(let i=0;i<n;i++){
    const y=i*ph;
    g+='<rect x="0" y="'+y+'" width="'+W2+'" height="'+ph+'" fill="'+base[i]+'"/>'
      +'<svg x="0" y="'+y+'" width="'+W2+'" height="'+ph+'" viewBox="0 0 '+W2+' '+ph+'" overflow="hidden">'
      +'<rect x="-160" y="-80" width="'+(W2+320)+'" height="'+(ph+160)+'" filter="url(#l'+(i%2)+')" opacity=".26"/>'
      +'<rect x="-160" y="-80" width="'+(W2+320)+'" height="'+(ph+160)+'" filter="url(#d'+(i%3)+')" opacity=".38"/></svg>';
  }
  for(let i=0;i<90;i++){
    const y=rnd()*H2,dy=()=>((rnd()-.5)*26).toFixed(1),dark=i%3!=0;
    g+='<path d="M0 '+y.toFixed(1)+'C'+(W2*.28).toFixed(0)+' '+(y+ +dy()).toFixed(1)+' '+(W2*.66).toFixed(0)+' '+(y+ +dy()).toFixed(1)+' '+W2+' '+(y+ +dy()).toFixed(1)+'" fill="none" stroke="'+(dark?'rgba(22,9,1,'+(.06+rnd()*.12).toFixed(2)+')':'rgba(255,224,172,'+(.05+rnd()*.08).toFixed(2)+')')+'" stroke-width="'+(.5+rnd()*.5).toFixed(2)+'"/>';
  }
  for(let i=0;i<8;i++){
    const bx=rnd()*W2,by=rnd()*H2,br=180+rnd()*260;
    g+='<ellipse cx="'+bx.toFixed(0)+'" cy="'+by.toFixed(0)+'" rx="'+br.toFixed(0)+'" ry="'+(br*.55).toFixed(0)+'" fill="url(#'+(i%2?'bl':'bd')+')"/>';
  }
  for(let i=0;i<3;i++){
    const kx=120+rnd()*(W2-240),ky=30+rnd()*(H2-60),kr=16+rnd()*14;
    for(let k=5;k>=1;k--)g+='<ellipse cx="'+kx.toFixed(0)+'" cy="'+ky.toFixed(0)+'" rx="'+(kr*k*1.5).toFixed(1)+'" ry="'+(kr*k*.55).toFixed(1)+'" fill="'+(k==1?'rgba(38,16,3,.4)':'none')+'" stroke="rgba(30,12,2,'+(.10+.04*(5-k)).toFixed(2)+')" stroke-width="'+(.6+.25*(5-k)).toFixed(2)+'"/>';
  }
  for(let i=0;i<n;i++){
    const y=i*ph;
    if(i>0)g+='<rect x="0" y="'+y+'" width="'+W2+'" height="12" fill="url(#sh)"/><rect x="0" y="'+(y-1.2)+'" width="'+W2+'" height="2.4" fill="rgba(14,6,0,.75)"/><rect x="0" y="'+(y+1.2)+'" width="'+W2+'" height="1.1" fill="rgba(255,220,170,.17)"/>';
    const jx=(150+rnd()*1300).toFixed(0);
    g+='<rect x="'+jx+'" y="'+y+'" width="2.2" height="'+ph+'" fill="rgba(14,6,0,.6)"/><rect x="'+(+jx+2.2)+'" y="'+y+'" width="1" height="'+ph+'" fill="rgba(255,220,170,.14)"/>';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W2+'" height="'+H2+'" viewBox="0 0 '+W2+' '+H2+'">'+g+'</svg>';
}

function roundEnded(){
  G.ended=true;

function loadStats(){try{const s=JSON.parse(localStorage.getItem('ulei-stats')||'{}');return s&&typeof s=='object'?s:{}}catch(e){return {}}}
function addStat(w,mo){
  const s=loadStats(),o=s[figMode]||{w:0,l:0,d:0,mw:0,ml:0,md:0};
  if(w==0)o.w=(o.w||0)+1;else if(w==1)o.l=(o.l||0)+1;else o.d=(o.d||0)+1;
  if(mo){const a=G.score[0],b=G.score[1];if(a>b)o.mw=(o.mw||0)+1;else if(b>a)o.ml=(o.ml||0)+1;else o.md=(o.md||0)+1}
  s[figMode]=o;
  try{localStorage.setItem('ulei-stats',JSON.stringify(s))}catch(e){}
}

/* ---------- сохранение партии ---------- */
function saveGame(){
  if(!started||!G)return;
  try{
    if(G.phase=='over'&&G.matchOver){localStorage.removeItem(SAVE_KEY);return}
    const g={};
    ['score','matchOver','flip','home','round','turn','phase','setupP','last','lastMove','winner','winBy','queenMade','mc','hist','np','best','ended'].forEach(k=>g[k]=G[k]);
    g.pcs=G.pcs.map(q=>({p:q.p,t:q.t,d:q.d,x:q.x,r:q.r,frz:q.frz,exp:q.exp,tn:q.tn}));
    g.rep=[...G.rep];
    localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,figMode,matchMode,vsAI,RULES,g}));
  }catch(e){}
}
function savedGame(){try{const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return o&&o.v==1&&o.g&&Array.isArray(o.g.pcs)?o:null}catch(e){return null}}
function canResume(){return started||!!savedGame()}
function resumeGame(){
  if(started){menu=false;hideSplash();return render()}
  const o=savedGame();if(!o)return hideSplash();
  figMode=['none','queen','swarm'].includes(o.figMode)?o.figMode:'queen';
  matchMode=o.matchMode=='free'?'free':'classic';vsAI=!!o.vsAI;
  RULES=Object.assign({free:true,rep:false,turn:true,freeze:false},o.RULES||{});
  menu=false;
  init(8);
  const g=o.g;
  if(g.pcs.length!=G.pcs.length){started=true;toast('Не удалось восстановить партию — начинаем новую.');return hideSplash()}
  Object.keys(g).forEach(k=>{if(k!='pcs'&&k!='rep'&&g[k]!==undefined)G[k]=g[k]});
  G.pcs.forEach((q,i)=>Object.assign(q,g.pcs[i]));
  G.rep=new Map(g.rep||[]);G.winFlash=false;G.sel=null;G.hopelessOffer=null;G.matchCard=false;G.mm=matchMode;
  started=true;pcPrev.clear();hideSplash();toast('Партия восстановлена.');render();
}

  {t:'Пчела',pic:'s',x:'Пчела (шестиконечная звезда) ходит на любую из шести соседних свободных клеток.'},
  {t:'Трутень',pic:'t',x:'Трутень (треугольник) ходит только на клетку, куда указывает одна из его вершин, и всегда остаётся на клетках своего «класса». Расставляйте трутней так, чтобы все дошли, — игра подскажет, если нет.'},
  {t:'Королева',pic:'q',x:'Королева (звезда с короной) ходит как пчела и может перепрыгнуть через соседнюю фигуру. Вместо хода она может толкнуть соседнюю фигуру на клетку дальше. В режиме «Без королевы» ею становится первая пчела, дошедшая до чужого улья.'},
  {t:'Как ходить',pic:'go',x:'Нажмите на свою фигуру — точками покажутся клетки, куда можно пойти, — затем на нужную клетку. Обычно одной фигурой нельзя ходить два раза подряд. Если '+NP_LIMIT+' ходов никто не продвинулся в чужой улей, раунд заканчивается ничьей. Кнопка «Подсказка» покажет хороший ход, а против компьютера можно отменить свой ход.'},
  {t:'Расстановка',pic:'setup',x:'Перед раундом нажмите на две свои фигуры, чтобы поменять их местами, затем «Готово». Полные правила всегда есть в «Установки → Правила», а это обучение — по кнопке «Как играть».'}
];
function tutSeen(){try{return localStorage.getItem('ulei-tut')==='1'}catch(e){return false}}
function showTut(){tutStep=0;render()}
function tutGo(d){tutStep=Math.max(0,tutStep+d);if(tutStep>=TUT.length)return tutEnd();render()}
function tutEnd(){tutStep=-1;try{localStorage.setItem('ulei-tut','1')}catch(e){}render()}
function tutPicSVG(kind){
  const th=theme,pc=(q,x,r,sel)=>'<g transform="translate('+px(x).toFixed(1)+','+py(r).toFixed(1)+')">'+(sel?ringSVG(th):'')+(th=='wood'?pieceWood(q,0):th=='honey'?pieceHoney(q,0):pieceSpace(q,0))+'</g>';
  const cs={wood:['rgba(30,15,5,.14)','rgba(240,214,160,.62)','rgba(32,16,3,.8)'],honey:['url(#hc)','url(#hb)','#9a6205'],space:['rgba(8,3,28,.3)','rgba(236,140,40,.36)','#9d7bff']}[th];
  let g=defs(th)+'<rect x="-200" y="-130" width="400" height="260" fill="'+({wood:'url(#wd)',honey:'url(#hbg)',space:'url(#sp)'}[th])+'"/>';
  for(let r=-2;r<=2;r++)for(let x=-6;x<=6;x++){
    if((x+r+100)%2)continue;
    const hv=kind=='hive'&&r==-2;
    g+='<polygon points="'+hexPts(px(x),py(r))+'" fill="'+(hv?cs[1]:cs[0])+'" stroke="'+cs[2]+'" stroke-width="1.6" stroke-linejoin="round"/>';
  }
  const dots=a=>a.map(([x,r])=>hintSVG(th,px(x),py(r))).join('');
  if(kind=='hive')g+=pc({p:0,t:'s'},-2,-2)+pc({p:0,t:'t',d:'up'},1,-1)+pc({p:0,t:'q'},4,0)+pc({p:0,t:'s'},-3,1)+dots([[0,-2],[2,-2]]);
  else if(kind=='s'||kind=='go')g+=pc({p:0,t:'s'},0,0,kind=='go')+dots(STAR)+(kind=='go'?pc({p:1,t:'t',d:'dn'},-4,0):'');
  else if(kind=='t')g+=pc({p:0,t:'t',d:'up'},0,0)+dots(UP);
  else if(kind=='q')g+=pc({p:0,t:'q'},0,0)+pc({p:0,t:'s'},2,0)+pc({p:1,t:'t',d:'dn'},-1,-1)+dots([[4,0],[-2,-2],[1,1],[-1,1],[1,-1],[-2,0]]);
  else if(kind=='setup')g+=pc({p:0,t:'s'},-2,0,true)+pc({p:0,t:'t',d:'dn'},2,0,true)
    +'<path d="M'+(px(-2)+26)+' -30Q0 -62 '+(px(2)-26)+' -30M'+(px(2)-26)+' -30l-10 -2M'+(px(2)-26)+' -30l-3 -10M'+(px(-2)+26)+' 30Q0 62 '+(px(2)-26)+' 30M'+(px(-2)+26)+' 30l10 2M'+(px(-2)+26)+' 30l3 10" fill="none" stroke="'+lastMoveColor(th)+'" stroke-width="3" stroke-linecap="round"/>';
  return '<svg class="tut-pic" viewBox="-200 -130 400 260" role="img" aria-label="'+TUT[tutStep].t+'">'+g+'</svg>';
}
function tutHTML(){
  const s=TUT[tutStep],last=tutStep==TUT.length-1;
  return '<div class="me-card"><div class="mut">Как играть · '+(tutStep+1)+' из '+TUT.length+'</div><h2>'+s.t+'</h2>'+tutPicSVG(s.pic)
    +'<p class="tut-txt">'+s.x+'</p><div class="tut-dots">'+TUT.map((_,i)=>'<i class="'+(i==tutStep?'on':'')+'"></i>').join('')+'</div>'
    +'<div class="me-btns">'+(tutStep>0?'<button onclick="tutGo(-1)">Назад</button>':'')
    +'<button class="go" onclick="tutGo(1)">'+(last?'Понятно, играем':'Дальше')+'</button>'
    +(last?'':'<button onclick="tutEnd()">Пропустить</button>')+'</div></div>';
}
/* ---------- приложение: service worker и обновление версий ---------- */
let swReg=null,swWant=false;
function showUpdate(w){
  const u=document.getElementById('upd');if(!u)return;
  u.innerHTML='<span>Доступна новая версия игры</span><button class="go" id="updGo">Обновить</button><button id="updLater">Позже</button>';
  u.hidden=false;
  document.getElementById('updGo').onclick=()=>{u.hidden=true;saveGame();swWant=true;w.postMessage('skipWaiting')};
  document.getElementById('updLater').onclick=()=>{u.hidden=true};
}
function watchSW(reg){
  swReg=reg;
  if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
  reg.addEventListener('updatefound',()=>{
    const w=reg.installing;if(!w)return;
    w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate(w)});
  });
}
function initSW(){
  try{
    if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!swWant)return;swWant=false;location.reload()});
    navigator.serviceWorker.register('sw.js').then(watchSW).catch(()=>{});
    const check=()=>{try{if(swReg)swReg.update()}catch(e){}};
    setInterval(check,60*60*1000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  }catch(e){}
}

function render(){
  applyNames();
  if(G.phase=='over'&&!G.ended)roundEnded();
  if(splash){const spl=document.getElementById('splash');spl.hidden=false;spl.innerHTML=splashHTML();centerLogo(spl)}
  const fs=fsOn(),bc=document.body.classList;
  bc.toggle('t-wood',theme=='wood');bc.toggle('t-honey',theme=='honey');bc.toggle('t-space',theme=='space');
  const de=document.documentElement;if(de&&de.style)de.style.background=({wood:'#24160a',honey:'#f3dc98',space:'#07031a'})[theme];
  const tcm=document.querySelector&&document.querySelector('meta[name=theme-color]');if(tcm)tcm.setAttribute('content',({wood:'#24160a',honey:'#f3dc98',space:'#07031a'})[theme]);
  bc.toggle('fs',fs);bc.toggle('need',fs&&(G.phase=='setup'||G.phase=='over'));
  if(!fs)bc.remove('panel');
  document.getElementById('fsmenu').textContent=bc.contains('panel')?'Закрыть':'Опции';
  const R=G.R,sel=G.sel!=null?G.pcs[G.sel]:null;
  const mv=sel?moves(sel).map(m=>key(...m)):[];
  const th=theme,m=TH[th].m,flip=G.flip;
  const vx=-W/2-6-m,vy=-S-6-m,vw=9.5*W+12+2*m,vh=(R-1)*1.5*S+2*S+12+2*m;
  const cxm=4.25*W,cym=(R-1)*.75*S,vr=G.phase!='setup'&&phoneView()&&vw/vh>1.15,ang=(flip?180:0)+(vr?90:0);
  const vb=vr?((cxm-vh/2).toFixed(1)+' '+(cym-vw/2).toFixed(1)+' '+vh.toFixed(1)+' '+vw.toFixed(1)):(vx+' '+vy+' '+vw+' '+vh);
  if(svg.getAttribute&&svg.getAttribute('viewBox')===vb){}else svg.setAttribute('viewBox',vb);
  const staticSVG=()=>{
    let t=defs(th);
    if(th=='honey')t+=bgHoney(vx,vy,vw,vh);
    if(th=='space')t+=bgSpace(vx,vy,vw,vh);
    for(const k of G.cells){const [x,r]=k.split(',').map(Number);t+=cellSVG(th,k,x,r)}
    return t;
  };
  let dyn='';
  for(const k of mv){
    const [x,r]=k.split(',').map(Number);
    dyn+=hintSVG(th,px(x),py(r));
  }
  if(G.lastMove&&G.phase!='setup'){
    const lm=G.lastMove,lc=lastMoveColor(th);
    dyn+=lastMoveSVG(px(lm.fromX),py(lm.fromR),lc,false);
    if(lm.fromX!=lm.toX||lm.fromR!=lm.toR)dyn+=lastMoveSVG(px(lm.toX),py(lm.toR),lc,true);
    if(lm.pushToX!=null){dyn+=lastMoveSVG(px(lm.pushFromX),py(lm.pushFromR),lc,false);dyn+=lastMoveSVG(px(lm.pushToX),py(lm.pushToR),lc,true)}
  }
  if(G.hint&&G.phase=='play'){
    const h=G.hint,hq=G.pcs[h.id],hc=hintColor(th);
    dyn+=hintMarkSVG(px(hq.x),py(hq.r),hc);
    if(h.k!='turn')dyn+=hintMarkSVG(px(h.x),py(h.r),hc);
    if(h.k=='push')dyn+=hintMarkSVG(px(h.tx),py(h.tr),hc);
  }
  const moved=[];
  for(const q of G.pcs){
    const dim=G.phase=='setup'&&q.p!=G.setupP?' opacity=".5"':'';
    const tx=px(q.x),ty=py(q.r),prev=pcPrev.get(q.id);
    if(prev&&(prev.x!==tx||prev.y!==ty))moved.push({id:q.id,fx:prev.x,fy:prev.y,tx,ty});
    const winCls=G.phase=='over'&&G.winner===q.p?' win-pc':'';
    const frozen=isFrozen(q)&&G.phase!='setup';
    dyn+='<g data-id="'+q.id+'" style="cursor:pointer;transform:translate('+tx+'px,'+ty+'px)"'+dim+'>'
      +(frozen?'<g class="frz-glow" style="--gc:'+engraveColor(q,th)+'">':'')
      +'<g class="pcin'+winCls+'">'+(G.sel==q.id?ringSVG(th):'')+(th=='wood'?pieceWood(q,ang):th=='honey'?pieceHoney(q,ang):pieceSpace(q,ang))+'</g>'
      +(frozen?'</g>':'')+'</g>';
    if(q.frz>0&&G.phase!='setup')dyn+=freezeBadgeSVG(q);
    pcPrev.set(q.id,{x:tx,y:ty});
  }
  if(G.phase=='play'&&G.sel!=null&&!(vsAI&&G.turn==1)){
    const sq=G.pcs[G.sel];
    if(RULES.turn&&sq.t=='t'&&sq.p==G.turn)dyn+=turnSVG(sq);
    if(sq.t=='q'&&sq.p==G.turn)pushDests(sq).forEach(pd=>dyn+=pushSVG(pd));
  }
  const rot='<g transform="rotate('+ang+' '+cxm+' '+cym+')">';
  if(svg.querySelector&&svg.dataset){
    const skey=[th,R,G.queen?1:0,G.swarm?1:0,ang].join('|'),dl=svg.querySelector('#dl');
    if(dl&&svg.dataset.k===skey)dl.innerHTML=dyn;
    else{svg.innerHTML=(ang?rot:'<g>')+'<g id="sl">'+staticSVG()+'</g><g id="dl">'+dyn+'</g></g>';svg.dataset.k=skey}
  }else{
    let h=staticSVG()+dyn;
    if(ang)h=rot+h+'</g>';
    svg.innerHTML=h;
  }
  if(moved.length&&typeof requestAnimationFrame=='function'&&svg.querySelector){
    const els=moved.map(m=>({m,el:svg.querySelector('[data-id="'+m.id+'"]')})).filter(o=>o.el);
    els.forEach(({m,el})=>{el.style.transition='none';el.style.transform='translate('+m.fx+'px,'+m.fy+'px)'});
    requestAnimationFrame(()=>{
      els.forEach(({el})=>{void el.getBoundingClientRect()});
      requestAnimationFrame(()=>{
        els.forEach(({m,el})=>{el.style.transition='transform .22s cubic-bezier(.3,.6,.3,1)';el.style.transform='translate('+m.tx+'px,'+m.ty+'px)'});
      });
    });
  }
  document.getElementById('score').innerHTML=[(G.mm=='classic'?'Классический режим, раунд '+Math.min(G.round,3)+' из 3':'Свободный режим, раунд '+G.round),scoreHTML()].concat(G.swarm?['рой против роя']:G.queen?['с королевой']:[]).concat((RULES.free||RULES.rep||RULES.turn)?['доп. правила']:[]).join(', ');
  document.getElementById('rules').innerHTML=rulesHTML();
  const st=document.getElementById('status');
  if(G.phase=='setup')st.textContent='Расстановка: '+N[G.setupP]+(vsAI?' (вы)':'')+'. Нажмите на две свои фигуры, чтобы поменять их местами.';
  else if(G.phase=='play')st.innerHTML=(vsAI&&G.turn==1?'Думает компьютер':'Ходят '+N[G.turn])+' <span class="chip" style="background:'+CHIP[theme][G.turn]+'"></span>'+(G.hopelessOffer?' — у '+N[G.hopelessOffer.loser]+' уже нет шансов догнать соперника':'')+(G.np>=NP_LIMIT-10?' <span class="mut">· без продвижения в улей ещё '+(NP_LIMIT-G.np)+' ход. — и ничья</span>':'');
  else if(G.phase=='over')st.innerHTML=overText();
  else st.textContent='';
  const wf=document.getElementById('winFlash');
  if(G.phase=='over'&&G.winFlash&&(G.winner==0||G.winner==1)){wf.innerHTML=winFlashHTML();wf.hidden=false;wf.onclick=dismissWinFlash}
  else wf.hidden=true;
  const me=document.getElementById('matchEnd');
  if(G.phase=='over'&&G.matchOver&&G.matchCard&&!G.winFlash&&!menu&&tutStep<0){me.innerHTML=matchEndHTML();me.hidden=false}else me.hidden=true;
  const tu=document.getElementById('tut');
  if(tutStep>=0){tu.innerHTML=tutHTML();tu.hidden=false}else tu.hidden=true;
  let c='';
  if(G.phase=='setup'){
    c+='<button class="go" onclick="ready()">'+(G.setupP==0&&!vsAI?'Готово, дальше — '+N[1]:'Готово, начать игру')+'</button>';
    c+='<button onclick="stdP(G.setupP)">Стандартная расстановка</button>';
  }
  if(G.phase=='over')c+=overButtons();
  if(G.phase=='play'&&G.hopelessOffer)c+='<button class="go" onclick="concedeHopeless()">Признать поражение</button><button onclick="dismissHopeless()">Играть дальше</button>';
  if(G.phase=='play'){
    const myTurn=!(vsAI&&G.turn==1);
    if(vsAI)c+='<button onclick="undoMove()"'+(G.undo.length?'':' disabled')+'>Отменить ход</button>';
    c+='<button onclick="showHint()"'+(myTurn?'':' disabled')+'>Подсказка</button>';
  }
  c+='<button onclick="openMenu()">Установки</button>';
  c+='<button onclick="init(G.R)">Начать заново</button>';
  if(fsOk)c+='<button onclick="toggleFS()">'+(fsOn()?'Оконный режим':'Полный экран')+'</button>';
  c+='<button onclick="toggleFlip()">Отразить экран</button>';
  c+='<button data-music class="'+(musicOn?'on':'')+'" onclick="toggleMusic()">Музыка: '+(musicOn?'вкл':'выкл')+'</button>';
  document.getElementById('ctl').innerHTML=c;
  if(menu){
    ov.hidden=false;
    ov.innerHTML=menuHTML();
  }else ov.hidden=true;
  saveGame();
  maybeAI();
}
function onResize(){
  const pv=phoneView()+'|'+((typeof innerHeight!='undefined'&&innerHeight<520&&innerWidth>innerHeight)?1:0);
  if(pv!==lastPV){lastPV=pv;render()}
}
if(window.addEventListener){
  const kick=d=>{clearTimeout(rzT);rzT=setTimeout(onResize,d)};
  window.addEventListener('resize',()=>kick(120));
  window.addEventListener('orientationchange',()=>{kick(120);setTimeout(onResize,400)});
  if(window.visualViewport&&window.visualViewport.addEventListener)window.visualViewport.addEventListener('resize',()=>kick(120));
  if(window.matchMedia){const mq=window.matchMedia('(orientation:portrait)');if(mq.addEventListener)mq.addEventListener('change',()=>{kick(60);setTimeout(onResize,350)})}
}
setThemeVars();
init(8);
setTimeout(bakeWood,50);
initSW();
</script>
